server:
    port: 8080

spring:
    application:
        name: AI-LiuYao
    main:
        allow-bean-definition-overriding: true
    # 数据库配置示例
    datasource:
        url: jdbc:mysql://localhost:3306/ai_liuyao?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
        username: your_username
        password: your_password
        driver-class-name: com.mysql.cj.jdbc.Driver
    # Redis配置示例
    redis:
        host: localhost
        port: 6379
        password: your_redis_password
        database: 0

# AI服务配置示例
ai:
    volcengine:
        api:
            key: your_volcengine_api_key
        model:
            id: deepseek-r1-250120
            name: DeepSeek-r1
        max-tokens: 2000
        temperature: 0.7

logging:
    level:
        root: INFO
        com.divination.liuyao: DEBUG
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
        name: logs/application.log

jwt:
    secret: your_very_long_and_secure_secret_key_at_least_64_bytes_long_for_hs512_algorithm
    token-expiration: 604800

mybatis:
    configuration:
        map-underscore-to-camel-case: true
    type-aliases-package: com.divination.liuyao.entity
    mapper-locations: classpath:mapper/*.xml 