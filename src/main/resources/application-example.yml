server:
    port: 8080

spring:
    application:
        name: AI-LiuYao
    main:
        allow-bean-definition-overriding: true
    # 数据库配置示例
    datasource:
        url: jdbc:mysql://localhost:3306/ai_liuyao?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
        username: your_username
        password: your_password
        driver-class-name: com.mysql.cj.jdbc.Driver
    # Redis配置示例
    redis:
        host: localhost
        port: 6379
        password: your_redis_password
        database: 0
    # 邮箱配置
    mail:
        host: smtp.qq.com
        port: 465
        username: your_qq_email@qq.com
        password: your_qq_email_authorization_code  # QQ邮箱授权码，非QQ密码
        protocol: smtps
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true
                    ssl:
                        enable: true

# AI服务配置示例
ai:
    # 默认使用的LLM服务类型：volcengine 或 dashscope
    default-llm-service: dashscope
    # 火山引擎配置
    volcengine:
        api:
            key: your_volcengine_api_key
        model:
            id: deepseek-r1-250120
            name: DeepSeek-r1
        max-tokens: 2000
        temperature: 0.7

    # 阿里百练配置
    dashscope:
        api:
            key: your_dashscope_api_key
        model:
            id: qwen-max # 或其他可用模型ID
            name: 通义千问
        max-tokens: 2000
        temperature: 0.7

# 系统额度支付时使用的默认模型 Key；也可通过 DEFAULT_API_KEY 注入。
default:
    api-key: ""

# 邮件服务配置
email:
    from: your_qq_email@qq.com  # 发件人邮箱，应与spring.mail.username一致
    personal: 爻算云鉴  # 发件人显示名称

app:
    # 逗号分隔的管理员用户名。留空时默认没有管理员权限。
    admin-usernames: admin
    cors:
        # 逗号分隔的前端来源；生产环境必须替换为实际域名。
        allowed-origins: http://localhost:5173,http://localhost:8080
    mcp:
        api-key: replace_with_a_random_mcp_api_key

# 对象存储使用 MinIO/S3 兼容环境变量配置：
# MINIO_ENDPOINT=http://localhost:9000
# MINIO_ACCESS_KEY=minioadmin
# MINIO_SECRET_KEY=minioadmin
# MINIO_BUCKET=ai-liuyao
# MINIO_REGION=us-east-1
# MINIO_PRESIGNED_URL_EXPIRY_SECONDS=3600

logging:
    level:
        root: INFO
        com.divination.liuyao: DEBUG
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
        name: logs/application.log

jwt:
    secret: your_very_long_and_secure_secret_key_at_least_64_bytes_long_for_hs512_algorithm
    token-expiration: 604800

mybatis:
    configuration:
        map-underscore-to-camel-case: true
    type-aliases-package: com.divination.liuyao.entity
    mapper-locations: classpath:mapper/*.xml
