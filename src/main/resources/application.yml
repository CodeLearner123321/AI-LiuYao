server:
  port: 8080

spring:
  application:
    name: AI-LiuYao
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    # 基本配置
    url: ${DB_URL:jdbc:mysql://localhost:3306/ysyj?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP配置
    hikari:
      # 连接池最大连接数
      maximum-pool-size: 5
      # 最小空闲连接数
      minimum-idle: 2
      # 连接空闲超时时间
      idle-timeout: 180000
      # 连接最大生命周期
      max-lifetime: 1800000
      # 连接超时时间
      connection-timeout: 30000
      # 测试连接有效性的语句
      connection-test-query: SELECT 1
      # 池中连接的默认自动提交行为
      auto-commit: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    #        过期时间设置为2分半
    timeout: 150000  # 连接超时时间(毫秒)
    lettuce:
      pool:
        max-active: 8  # 连接池最大连接数
        max-idle: 8    # 连接池中的最大空闲连接
        min-idle: 0    # 连接池中的最小空闲连接
        max-wait: -1   # 连接池最大阻塞等待时间(负值表示没有限制)
      shutdown-timeout: 100ms  # 关闭超时时间

  # 邮箱配置 - 使用环境变量或默认QQ邮箱测试账号
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:ysyj.kaojuzi@qq.com}
    password: ${MAIL_PASSWORD:ejgdwskqzxmnbgjb}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true


ai:
  # 默认使用的LLM服务类型
  default-llm-service: ${DEFAULT_LLM_SERVICE:volcengine}
  # 火山引擎配置
  volcengine:
    api:
      key: ${VOLCENGINE_API_KEY:sk-28a277c000fd42ceab9b732cee9ea569}
    model:
      id: ${VOLCENGINE_MODEL_ID:deepseek-r1-250120}
      name: DeepSeek-r1
    max-tokens: 2000
    temperature: 0.7
  # 阿里百练配置
  dashscope:
    api:
      key: ${DASHSCOPE_API_KEY:sk-28a277c000fd42ceab9b732cee9ea569}
    model:
      id: ${DASHSCOPE_MODEL_ID:qwen-vl-max}
      name: 通义千问-视觉
    max-tokens: 2000
    temperature: 0.7

# 邮件服务配置
email:
  from: ${MAIL_USERNAME:ysyj.kaojuzi@qq.com}
  personal: 爻算云鉴
default:
  apiKey: 87bfac64-5eb6-44e0-bc50-54417294bebb

logging:
  level:
    root: INFO
    com.divination.liuyao: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

jwt:
  secret: ${JWT_SECRET:your_test_secret_key_at_least_64_bytes_long_for_hs512_algorithm}
  token-expiration: 604800

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.divination.liuyao.entity
  mapper-locations: classpath:mapper/*.xml

