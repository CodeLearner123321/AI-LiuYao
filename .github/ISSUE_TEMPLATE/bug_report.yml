name: Bug report
description: 报告可复现的缺陷（安全问题请勿使用公开 Issue）
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请移除日志中的密钥、Token、用户问题和其他个人信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit 或版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、JDK、部署方式及相关依赖版本。
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
